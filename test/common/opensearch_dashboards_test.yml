# Test environment config — mirrors opensearch_dashboards.yml but without
# server.basePath / server.rewriteBasePath so the functional test framework
# can reach API endpoints directly at /api/* without any path prefix.
server.host: "127.0.0.1"
opensearch.preserveHost: true
opensearchDashboards.index: ".opensearch_dashboards"
opensearchDashboards.defaultAppId: "dashboard"
opensearch.requestTimeout: 300000
opensearch.shardTimeout: 0
